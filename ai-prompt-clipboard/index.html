<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Prompt Clipboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234f46e5'/%3E%3Crect x='27' y='22' width='46' height='62' rx='7' fill='none' stroke='white' stroke-width='7'/%3E%3Cpath d='M39 22v-3c0-6 5-11 11-11h0c6 0 11 5 11 11v3' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M39 42h22M39 54h22M39 66h14' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

    <header>
        <div class="head">
            <a class="brand">
                <span class="brandmark">
                    <svg viewBox="0 0 24 24">
                        <rect x="6" y="4" width="12" height="17" rx="2"/>
                        <path d="M9 4V3.8A1.8 1.8 0 0 1 10.8 2h2.4A1.8 1.8 0 0 1 15 3.8V4M9 9h6M9 13h6M9 17h4"/>
                    </svg>
                </span>
                Prompt Clipboard
            </a>

            <button id="theme" class="theme">
                <svg class="sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>

                <svg class="moon" viewBox="0 0 24 24">
                    <path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5a8.7 8.7 0 1 0 10.7 10.7Z"/>
                </svg>

                <span id="themeText"></span>
            </button>
        </div>
    </header>

    <main>
        <div class="hero">
            <div class="eyebrow">PERSONAL LIBRARY</div>
            <h1>AI Prompt Library</h1>
        </div>

        <div class="toolbar">
            <label class="search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="6.5"/>
                    <path d="m16 16 4.2 4.2"/>
                </svg>

                <input id="search" placeholder="Search prompts...">
            </label>

            <div id="cats" class="cats"></div>
        </div>

        <section id="grid" class="grid"></section>

        <div id="empty" class="empty" hidden>
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="m16 16 4.2 4.2"/>
            </svg>

            <h2>No prompts found</h2>
            <p>Try another search or category.</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="prompts.js"></script>
    <script src="app.js"></script>

</body>
</html>

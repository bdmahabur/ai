<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front Side NID Card Generator</title>

    >
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{--bg:#e8edf7;--primary:#193b96;--text:#172033}
html,body{margin:0;padding:0}
body{
    background:var(--bg);
    color:var(--text);
    font-family:"SolaimanLipi","SolaimanLipi",serif;
}
.container{width:min(1000px,calc(100% - 30px));margin:30px auto}
.form-box{
    background:#fff;padding:28px;border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08)
}
.title{margin:0 0 6px;font-size:28px}
.subtitle{margin:0 0 24px;color:#667085}
.section-title{
    margin:24px 0 14px;padding-bottom:8px;
    border-bottom:1px solid #d6dce8;font-size:19px;font-weight:700
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}
label{font-size:16px;font-weight:600}
input,textarea{
    width:100%;border:1px solid #ccd4e2;background:#f8faff;
    border-radius:8px;padding:11px 13px;font-family:inherit;
    font-size:16px;outline:none
}
input:focus,textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(25,59,150,.1)
}
textarea{min-height:80px;resize:vertical}
input[type=file]{background:#fff;padding:8px}
.buttons{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
button{
    border:0;border-radius:8px;padding:11px 20px;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#edf0f5;color:#273142}
.preview-section{margin-top:30px}
.preview-title{text-align:center;margin-bottom:16px}
.card-wrapper{
    display:flex;justify-content:center;overflow:auto;
    padding:25px;background:#dce3f0;border-radius:14px
}

/* Exact card size */
.id-card{
    position:relative;
    width:86mm;height:54mm;
    min-width:86mm;min-height:54mm;
    max-width:86mm;max-height:54mm;
    background:#fff;border: 0.6mm solid #222;
    
    font-family:"Noto Sans Bengali",sans-serif;color:#111;
}
.demo-watermark{
    position:absolute;z-index:20;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(-25deg);
    font-family:Arial,sans-serif;font-size:8mm;font-weight:900;
    color:rgba(180,0,0,.10);white-space:nowrap;pointer-events:none
}
.card-header{
    font-family:"SolaimanLipi","SolaimanLipi",serif;
    width:100%;height:16.5mm;display:flex;align-items:center;
    padding:1.2mm 2mm;border-bottom:.6mm solid #222
}
.logo{
    width:8mm;height:8mm;border-radius:50%;display:flex;
    align-items:center;justify-content:center;background:#e3ebff;
    color:#173c96;font-family:Arial,sans-serif;font-size:3.2mm;
    font-weight:bold;flex-shrink:0
}
.header-text{flex:1;text-align:center;line-height:1.15;}
.header-text strong{display:block;font-size:4.5mm;font-weight: 500}
.header-text span{
    margin-top: 0.5mm;
    display:block;font-family:"SolaimanLipi","SolaimanLipi",serif;
    font-size:3.1mm;
}
.header-text small{
    margin-top: 0.8mm;
    display:block;font-family:"SolaimanLipi","SolaimanLipi",serif;
    font-size:2.9mm;
}
.sample-label{font-family:Arial,sans-serif;font-size:1.8mm;font-weight:bold;color:#a00000}
.card-body{
    position:relative;width:100%;height:calc(100% - 12mm);
    padding:2mm;display:flex;
    z-index: 2;
}
.photo-area{width:18.2mm;flex-shrink:0;margin-right:1.5mm}
.photo,.photo-placeholder{width:18.2mm;height:20.4mm}
.photo{object-fit:cover;display:block;border:0}
.photo-placeholder{
    display:flex;align-items:center;justify-content:center;
    border:0;background:#eef1f6;font-size:2.5mm
}
.photo-signature{
    width:18.2mm;
    margin-top:2mm;
    text-align:center;
}
.signature{
    width:18.2mm;
    height:6mm;
    object-fit:contain;
    display:block;
}
.signature-line{
    border-top:.2mm solid #222;
    padding-top:.3mm;
    font-size:1.7mm;
}
.details{flex:1;min-width:0;font-size:3.25mm;line-height:1.40;font-family:"SolaimanLipi","SolaimanLipi",serif;}
.detail-row{display:flex;width:100%;margin-bottom:.6mm}
.detail-label{width:13mm;flex-shrink:0;font-weight:500}
.detail-label-dob{width:20mm;flex-shrink:0;font-weight:500;}
.detail-label-id{width:11mm;flex-shrink:0;font-weight:500;}

.detail-row span:last-child{flex:1;min-width:0;word-break:break-word}

.signature-area{
    position:absolute;right:2mm;bottom:1.5mm;width:15mm;text-align:center
}
.signature{width:14mm;height:6mm;object-fit:contain}
.signature-line{border-top:.2mm solid #222;padding-top:.3mm;font-size:1.7mm}


/* Screen A4 preview */
.a4-page{
    width:210mm;min-height:297mm;background:#fff;
    display:flex;flex-direction:row;justify-content:center;
    align-items:flex-start;gap:2.5mm;padding-top:15mm;
    margin:0 auto
}

/* Print */
@media print{
    @page{size:A4 portrait;margin:0}
    html,body{width:210mm;min-height:297mm;background:#fff}
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{
        position:absolute;left:0;top:0;
        width:210mm;height:297mm;margin:0;padding:0
    }
    .a4-page{
        width:210mm;height:297mm;min-height:297mm;
        padding-top:15mm;margin:0;
        display:flex;flex-direction:row;
        justify-content:center;align-items:flex-start;
        gap:2.5mm;background:#fff
    }
    .id-card{
        width:86mm!important;height:54mm!important;
        min-width:86mm!important;min-height:54mm!important;
        max-width:86mm!important;max-height:54mm!important;
        margin:0!important;box-shadow:none!important;flex-shrink:0
    }
    .preview-title{display:none}
}
@media(max-width:700px){
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    .form-box{padding:18px}
}
.demo-watermark{
    position:absolute;
    z-index:1;
    left:57%;
    top:64%;
    width:29mm;
    height:auto;
    transform:translate(-57%,-56%);
    opacity:0.4;
    pointer-events:none;
    user-select:none;
}
</style>
</head>

<body>
<div class="container">

<div class="form-box">
<h1 class="title">NID Card Generator</h1>
<p class="subtitle">Front Part 86mm x 54mm</p>

<div class="section-title">ছবি ও স্বাক্ষর</div>
<div class="grid">
    <div class="field">
        <label>ছবি</label>
        <input id="photoInput" type="file" accept="image/*">
    </div>
    <div class="field">
        <label>স্বাক্ষর</label>
        <input id="signatureInput" type="file" accept="image/*">
    </div>
</div>

<div class="section-title">ব্যক্তিগত তথ্য</div>
<div class="grid">
    <div class="field">
        <label>নাম (বাংলা)</label>
        <input id="nameBn" type="text" placeholder="বাংলায় নাম লিখুন">
    </div>
    <div class="field">
        <label>নাম (ইংরেজি)</label>
        <input id="nameEn" type="text" placeholder="Enter name">
    </div>
    <div class="field">
        <label>পিতার নাম</label>
        <input id="father" type="text">
    </div>
    <div class="field">
        <label>মাতার নাম</label>
        <input id="mother" type="text">
    </div>
    <div class="field">
        <label>আইডি নম্বর</label>
        <input id="idNumber" type="text">
    </div>
    <div class="field">
        <label>জন্ম তারিখ</label>
        <input id="dob" type="date">
    </div>
   <!-- <div class="field">
        <label>স্বামী/স্ত্রীর নাম</label>
        <input id="spouse" type="text">
    </div> -->
</div>

<div class="buttons">
    <button class="primary" onclick="generateCard()">✓ কার্ড তৈরি করুন</button>
    <button class="primary" onclick="printCard()">🖨 প্রিন্ট করুন</button>
<button class="primary" type="button" onclick="downloadCardPNG()">⬇ PNG ডাউনলোড</button>
    <button class="secondary" onclick="resetForm()">রিসেট</button>
</div>
</div>

<div class="preview-section">
<div id="printArea">
<div class="a4-page">

<!-- FRONT -->
<div class="id-card">
<img crossorigin="anonymous" class="demo-watermark" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/National_emblem_of_Bangladesh.svg/960px-National_emblem_of_Bangladesh.svg.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" width="70mm" height="70mm" alt="Logo">
<div class="card-header">
    <div class="logo">
        <img crossorigin="anonymous" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Government_Seal_of_Bangladesh.svg/960px-Government_Seal_of_Bangladesh.svg.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" width="31mm" height="31mm" alt="Logo">


    </div>
    <div class="header-text">
        <strong>গণপ্রজাতন্ত্রী বাংলাদেশ সরকার</strong>
        <font color="green"><span>Government of the People's Repulic of Bangladesh</span></font>
       <small><font color="red">National ID Card</font> / জাতীয় পরিচয় পত্র </small> 
    </div>
</div>

<div class="card-body">

<div class="photo-area">
    <div id="photoPlaceholder" class="photo-placeholder">ছবি</div>
    <img id="cardPhoto" class="photo" style="display:none" alt="Photo">

    <div class="photo-signature">
        <img id="cardSignature" class="signature" style="display:none" alt="Signature">
    </div>
</div>

<div class="details">
    <div class="detail-row"><span class="detail-label">নাম:</span><b><span id="cardNameBn">—</span></b></div>
    <div class="detail-row"><span class="detail-label">Name:</span><span id="cardNameEn">—</span></div>
    <div class="detail-row"><span class="detail-label">পিতা:</span><span id="cardFather">—</span></div>
    <div class="detail-row"><span class="detail-label">মাতা:</span><span id="cardMother">—</span></div>
    <div class="detail-row"><span class="detail-label-dob">Date of Birth:</span><font color="red"><span id="cardDob">—</span></font></div>
    <div class="detail-row"><span class="detail-label-id">ID NO:</span><font color="red"><b><span id="cardId">—</span></b></font></div>
    
</div>


</div>


</div>

</div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
function value(id){
    return document.getElementById(id).value.trim();
}

function text(id,val){
    document.getElementById(id).textContent = val || "—";
}

function dateFormat(val) {
    if (!val) return "—";

    const date = new Date(val + "T00:00:00");

    const day = date.getDate();

    const month = date.toLocaleString("en-US", {
        month: "short"
    });

    const year = date.getFullYear();

    return `${day} ${month} ${year}`;
}

function generateCard(){
    text("cardNameBn",value("nameBn"));
    text("cardNameEn",value("nameEn"));
    text("cardFather",value("father"));
    text("cardMother",value("mother"));
    text("cardId",value("idNumber"));
    text("cardDob",dateFormat(value("dob")));
}

function printCard(){
    generateCard();

    // Give the browser a moment to update the card before opening print.
    setTimeout(function(){
        window.print();
    }, 200);
}

async function downloadCardPNG(){
    generateCard();

    if(typeof html2canvas === "undefined"){
        alert("PNG ডাউনলোড লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।");
        return;
    }

    const card = document.querySelector("#printArea .id-card");

    if(!card){
        alert("কার্ড পাওয়া যায়নি।");
        return;
    }

    try{
        // Wait for fonts.
        if(document.fonts && document.fonts.ready){
            await document.fonts.ready;
        }

        // Wait for all card images.
        const images = Array.from(card.querySelectorAll("img"));
        await Promise.all(images.map(function(img){
            return new Promise(function(resolve){
                if(img.complete){
                    resolve();
                }else{
                    img.onload = resolve;
                    img.onerror = resolve;
                }
            });
        }));

        const canvas = await html2canvas(card,{
            scale:4,
            backgroundColor:"#ffffff",
            useCORS:true,
            allowTaint:false,
            logging:false,
            imageTimeout:15000
        });

        canvas.toBlob(function(blob){
            if(!blob){
                alert("PNG তৈরি করা যায়নি।");
                return;
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const id = value("idNumber") || "ID-Card";

            link.href = url;
            link.download = "nid-front-" + id + ".png";
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(function(){
                URL.revokeObjectURL(url);
            },1000);
        },"image/png");

    }catch(error){
        console.error("PNG download error:",error);
        alert("PNG ডাউনলোড করা যায়নি। আবার চেষ্টা করুন।");
    }
}

function loadImage(inputId,imgId,placeholderId=null){

    document.getElementById(inputId).addEventListener("change",function(){

        const file=this.files[0];
        if(!file)return;

        const reader=new FileReader();

        reader.onload=function(e){

            const img=document.getElementById(imgId);
            img.src=e.target.result;
            img.style.display="block";

            if(placeholderId){
                document.getElementById(placeholderId).style.display="none";
            }
        };

        reader.readAsDataURL(file);
    });
}

loadImage("photoInput","cardPhoto","photoPlaceholder");
loadImage("signatureInput","cardSignature");

function resetForm(){

    document.querySelectorAll("input,textarea").forEach(el=>{
        el.value="";
    });

    document.getElementById("cardPhoto").src="";
    document.getElementById("cardPhoto").style.display="none";
    document.getElementById("photoPlaceholder").style.display="flex";

    document.getElementById("cardSignature").src="";
    document.getElementById("cardSignature").style.display="none";

    [
        "cardNameBn","cardNameEn","cardFather","cardMother",
        "cardId","cardDob"
    ].forEach(id=>text(id,""));

    setToday();
}

function setToday(){
    const d=new Date();
    const local=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    document.getElementById("issueDate").value=local;
}

setToday();
generateCard();
</script>

</body>
</html>
